# SUPERSEDED — reference only. The live deployment is infra's
# stacks/bellwether (compose.yaml + .env on the runtime host), which serves
# https://bellwether.colobus-stargazer.ts.net through an oauth2-proxy door in
# the sidecar's netns. This file describes the torn-down Docker-Desktop deploy
# it was ported from; it has no door of its own, so an app brought up from
# here answers 401 to everything (see AUTH.md — Pocket ID is the only way in).
#
# Bellwether — self-contained tailnet deployment (Mac / Docker Desktop).
#
# Brings up the portal server + worker + its own Postgres on a private network.
# The server remains published on host loopback (127.0.0.1:17893), where the
# existing host-side `tailscale serve` fronts it onto the tailnet at
#   https://elrics-mac-mini.tail49736b.ts.net:8443
# as a migration fallback. The `tailscale` sidecar gives Bellwether its own
# tailnet identity and preferred URL:
#   https://bellwether.tail49736b.ts.net
#
# Secrets come from a gitignored .env (passwords) + read-only bind mounts of the
# canonical agent-resources credential files (PAPER only). PAPER MONEY ONLY.
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build

name: bellwether

services:
  db:
    image: postgres:16-alpine
    container_name: bellwether-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_trading_platform
      POSTGRES_USER: atp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atp -d agent_trading_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bellwether:latest
    container_name: bellwether-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:17893:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      PUBLIC_BASE_URL: "https://elrics-mac-mini.tail49736b.ts.net:8443"
      DATABASE_URL: "postgres://atp:${POSTGRES_PASSWORD}@db:5432/agent_trading_platform"
      ALPACA_PAPER_CREDENTIAL_FILE: /run/secrets/alpaca-paper.env
      # P6c runs the Strategy/Analyst chat agent in the server request path, so the
      # server now needs the OpenAI-OAuth credential (same file the worker mounts).
      LLM_OAUTH_CREDENTIAL_FILE: /run/secrets/openai-oauth.json
      # Identity: Pocket ID only, verified by signature against the issuer's
      # JWKS. The app has no password and trusts no header, so it needs an
      # OIDC proxy in front that forwards the id token
      # (--pass-authorization-header). Roles live in the portal_users table,
      # not here. Any retired PORTAL_ADMIN_*/PORTAL_TRUSTED_PROXY_*/
      # PORTAL_ROLE_* left set refuses the boot.
      PORTAL_OIDC_ISSUER: ${POCKETID_ISSUER:?set POCKETID_ISSUER in .env}
      PORTAL_OIDC_AUDIENCE: ${POCKETID_CLIENT_ID:?set POCKETID_CLIENT_ID in .env}
    volumes:
      - ${BELLWETHER_AGENT_RESOURCES}/alpaca-paper.env:/run/secrets/alpaca-paper.env:ro
      - ${BELLWETHER_AGENT_RESOURCES}/openai-oauth.json:/run/secrets/openai-oauth.json:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Independent workload identity for Bellwether. Tailscale Serve terminates
  # tailnet HTTPS inside this sidecar and proxies over the private Compose
  # network to `server:3000`. The app itself remains unreachable from the LAN.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: bellwether-tailscale
    hostname: bellwether
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: bellwether
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # Preserve Docker's embedded DNS so the Serve proxy resolves `server`.
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/tailscale-serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/tailscale-serve.json:ro

  worker:
    image: bellwether:latest
    container_name: bellwether-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: "postgres://atp:${POSTGRES_PASSWORD}@db:5432/agent_trading_platform"
      ALPACA_PAPER_CREDENTIAL_FILE: /run/secrets/alpaca-paper.env
      LLM_OAUTH_CREDENTIAL_FILE: /run/secrets/openai-oauth.json
      WORKER_READY_FILE: /tmp/worker-ready
    volumes:
      - ${BELLWETHER_AGENT_RESOURCES}/alpaca-paper.env:/run/secrets/alpaca-paper.env:ro
      - ${BELLWETHER_AGENT_RESOURCES}/openai-oauth.json:/run/secrets/openai-oauth.json:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
  # Device keys and node identity. Do not delete during ordinary redeployments.
  tailscale-state:
